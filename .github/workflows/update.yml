name: 更新主页数据

on:
  schedule:
    - cron: "17 0 * * *"   # 每天北京时间 08:17
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/profile.json", "scripts/**", "README.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取 GitHub 与 CSDN 数据并生成卡片
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py --fetch
      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 自动更新主页数据"
          git push
